<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #05050a; color: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .auth-card { background: #0e0e18; border: 1px solid #1a1a2e; border-radius: 12px; width: 100%; max-width: 420px; padding: 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .tabs { display: flex; margin-bottom: 25px; border-bottom: 2px solid #1a1a2e; }
    .tab-btn { flex: 1; padding: 12px; background: none; border: none; color: #888; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .tab-btn.active { color: #00f3ff; border-bottom: 2px solid #00f3ff; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #22223b; background: #05050a; color: #fff; font-size: 14px; outline: none; }
    input:focus { border-color: #00f3ff; }
    button.submit-btn { width: 100%; padding: 12px; border: none; border-radius: 6px; background: linear-gradient(135deg, #00f3ff, #b000ff); color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .form-container { display: none; }
    .form-container.active { display: block; }
    #message { margin-top: 15px; text-align: center; font-size: 14px; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="form-container active" onsubmit="handleAuth(event, '/api/login')">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" required placeholder="user@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="submit-btn">Login</button>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" class="form-container" onsubmit="handleAuth(event, '/api/signup')">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required placeholder="john_doe" />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" required placeholder="user@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="submit-btn">Create Account</button>
    </form>

    <div id="message"></div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));
      
      if (tab === 'login') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('loginForm').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('signupForm').classList.add('active');
      }
      document.getElementById('message').innerText = '';
    }

    async function handleAuth(e, endpoint) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());
      const msgDiv = document.getElementById('message');

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        msgDiv.style.color = result.success ? '#00f3ff' : '#ff4d4d';
        msgDiv.innerText = result.message;
      } catch (err) {
        msgDiv.style.color = '#ff4d4d';
        msgDiv.innerText = 'Server connection failed.';
      }
    }
  </script>
</body>
</html>
